name: Scenario static contracts
on: [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python Tests/Production/test_scenarios.py
      - run: python Tests/Release/test_scenario_package.py
      - run: python Tests/Release/validate_add_changenote.py
  windows-tooling:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: sucRo-RimWorld/Ancient-Medieval-Japan-Grains
          ref: 9e1898de7104cd951349c6fc0da8ce870626721c
          path: Tests/Fixtures/GrainsOwner
      - name: Parse scripts with Framework-era Windows PowerShell
        shell: powershell
        run: |
          foreach ($script in Get-ChildItem Scripts,Tests -Recurse -File -Filter *.ps1 | Where-Object { $_.FullName -notlike '*GrainsOwner*' }) {
            $tokens=$null; $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($script.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw "$($script.FullName): $errors" }
          }
      - name: Profile staging, provider isolation, summary and ERROR negatives
        shell: powershell
        run: ./Tests/test_scenario_profiles.ps1 -GrainsRepositoryRoot ./Tests/Fixtures/GrainsOwner
